<!--Two way data binding-->
<div class="max-w-md mx-auto mt-10 p-6 bg-white dark:bg-gray-900 rounded-xl shadow-lg space-y-4">
  <!-- Display the message -->
   <h2 class="text-center text-3xl font-bold">Two Way Binding Demo</h2>
  <p class="text-gray-800 dark:text-gray-100 text-lg font-medium break-words">
    {{ message() || 'Your message will appear here...' }}
  </p>

  <!-- Input field -->
  <input
    type="text"
    [(ngModel)]="message"
    class="will-change-contents w-full px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600 
           bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-100 placeholder-gray-400 dark:placeholder-gray-500
           focus:outline-none focus:ring-2 focus:ring-green-400 focus:border-green-400 transition-colors duration-200"
  />

  <!-- Button -->
  <button
    (click)="onButtonClick()"
    class="w-full bg-green-500 hover:bg-green-600 text-white font-semibold py-2 px-4 rounded-lg shadow-md 
           transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-green-400 focus:ring-offset-1"
  >
    Click here to change text programmatically!
  </button>
</div>
<!--Events demo -->
<div class="max-w-md mx-auto mt-10 p-6 bg-white dark:bg-gray-900 rounded-xl shadow-lg space-y-4">
  <!-- Display the message -->
   <h2 class="text-center text-3xl font-bold">Events</h2>
   <h3 class="text-center text-3xl font-bold">Parent Here</h3>
   <app-child (output)="handleChildOutput($event)"/>
  
</div>
