<div class="bg-white border border-gray-300 rounded-xl shadow-md p-4 hover:shadow-lg transition-shadow duration-300 overflow-hidden">
  <!-- Product Image -->
  <img 
    [src]="product().image" 
    alt="{{ product().title }}" 
    class="h-36 w-full object-contain mb-3 rounded-lg shadow-sm"
  />

  <!-- Product Title -->
  <h3 class="text-lg font-semibold text-gray-800 mb-1">{{ product().title }}</h3>

  <!-- Category -->
  <p class="text-gray-500 text-xs mb-1 uppercase tracking-wide">{{ product().category }}</p>

  <!-- Price -->
  <p class="text-indigo-600 font-bold text-xl mb-2">${{ product().price }}</p>

  <!-- Rating -->
  <div class="flex items-center space-x-1 text-yellow-500 mb-2 text-sm">
    <span>⭐ {{ product().rating.rate }}</span>
    <span class="text-gray-400">({{ product().rating.count }})</span>
  </div>

  <!-- Buy Button -->
  <button class="w-full px-3 py-1.5 bg-indigo-600 text-white font-semibold rounded-lg shadow hover:bg-indigo-700 transition-colors text-sm">
    Buy
  </button>
</div>
