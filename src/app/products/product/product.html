<a [routerLink]="['/products', product().id]">
  <div
    class="group bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-2xl shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all duration-300 overflow-hidden min-h-[400px] flex flex-col justify-between"
  >
    <!-- Image Wrapper -->
    <div class="relative bg-gray-50 dark:bg-gray-700 p-3 overflow-hidden h-36 w-full">
      <img
        [ngSrc]="product().image"
        width="400"
        height="300"
        alt="{{ product().title }}"
        class="object-contain w-full h-full transition-transform duration-300 group-hover:scale-105"
      />
    </div>

    <!-- Content -->
    <div class="p-4 flex flex-col flex-1 justify-between">
      <!-- Category -->
      <p class="text-xs text-gray-400 dark:text-gray-300 uppercase tracking-wider mb-1">
        {{ product().category }}
      </p>

      <!-- Title -->
      <h3 class="text-base font-semibold text-gray-800 dark:text-gray-100 mb-2 line-clamp-2">
        {{ product().title }}
      </h3>

      <!-- Price + Rating -->
      <div class="flex items-center justify-between mb-3">
        <span class="text-indigo-600 dark:text-indigo-400 font-bold text-xl">
          ${{ product().price }}
        </span>

        <div class="flex items-center text-sm text-yellow-500">
          <span class="mr-1">⭐ {{ product().rating.rate }}</span>
          <span class="text-gray-400 dark:text-gray-300 text-xs">
            ({{ product().rating.count }})
          </span>
        </div>
      </div>

      <!-- CTA -->
      <button
        class="w-full py-2 rounded-xl font-semibold text-sm bg-indigo-600 dark:bg-indigo-500 text-white hover:bg-indigo-700 dark:hover:bg-indigo-600 focus:outline-none focus:ring-2 focus:ring-indigo-400 transition-all duration-200"
      >
        Add to cart
      </button>
    </div>
  </div>
</a>
